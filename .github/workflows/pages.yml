name: Handbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - run: python3 -m unittest discover -s design-system/tools/opencode-mirror/tests -v
      - run: python3 design-system/scripts/test_build.py
      - run: python3 design-system/scripts/build.py --public --embed-fonts
      - run: python3 design-system/scripts/build.py --public --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: handbook

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
